<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form-input</title> 
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
</head>
<body class="container-fluid">
    <div id="buttonContainer" class="mt-4">
        <button class="btn btn-primary" data-bs-target="#register" data-bs-toggle="modal">Add Product</button>

    </div>
    <div class="modal fade" id="register">
        <div class="modal-dialog"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Product</h2>
                <button class="btn btn-close" data-bs-dismiss="modal"></button>

            </div>
            <div class="modal-body">
                <dl>
                    <dt>names </dt>
                    <dd><input type="text" id="txtName" class="form-control"></dd>
                    <dt>Price</dt>
                    <dd><input type="number" id="txtNumber" class="form-control"></dd>
                    <dt>Shopped to</dt>
                    <dd>
                        <select class="form-select" id="lstCities">
                            <option>select city</option>
                            <option>delhi</option>
                            <option>hyd</option>
                        </select>
                    </dd>
                    <dt>Stock</dt>
                    <dd class="form-switch">
                        <input class="form-check-input" type="checkbox" id="optStock"><label class="form-check-label"></label>
                    </dd>
                </dl>
            </div>
            <div class="modal-footer">
                <button id="btnRegister" class="btn btn-primary">Register</button>
                <button  class="btn btn-danger" data-bs-dismiss="modal">Cancel</button>

            </div>
        </div>
    </div>
    <div id="detailsContainer">

    </div>

    <script src="../node_modules/jquery/dist/jquery.js"></script>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    
</body>
</html>
