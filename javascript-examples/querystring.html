<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query-string</title>
    <script>
        function bodyload()
        {
            str = location.search;
            document.queryselector("p").innerHTML = str;
        }
    </script>
</head>
<body onload="bodyload()">
    <p></p>
</body>
</html>
