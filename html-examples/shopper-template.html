<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopper-template</title>
    <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        header
        {
            font-size: 25px;
            font-family: Arial;
            display: flex;
            justify-content: space-between;
            padding: 15px;
           
        }
        .brand-title
        {
            font-size: 30px;
            font-weight: bold;
        }
        nav span
        {
            margin-right: 15px;
        }
        .cart-count
        {
            background-color: red;
            color: white;
            border-radius: 25px;
            padding: 3px;
            display: inline-block;
            width: 25px;
            text-align: center;
            font-size: 15px;
        }
        article
        {
            background-color: black;
            color: white;
            font-size: 20px;
            text-align: center;
            padding: 20px;
        }
        .bi-lightning-fill
        {
            color: gold;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <span class="brand-title">Shopper.</span>

        </div>
        <div>
            <nav>
                <span>Home</span>
                <span>catelog</span>
                <span>shop</span>
                <span>pages</span>
                <span>blog</span>
                <span>docs</span>
            </nav>

        </div>
        <div>
            <nav>
                <span class="bi bi-search"></span>
                <span class="bi bi-person-fill"></span>
                <span class="bi bi-heart"></span>
                <span class="bi bi-cart4"><span class="cart-count">2</span></span>
            </nav>

        </div>
    </header>
    <article>
        <marquee>
        <span class="bi bi-lightning-fill"></span>
        <span>HAPPY HOLIDAY DEALS ON EVERYTHING</span>
        <span class="bi bi-lightning-fill"></span>
    </marquee>
    </article>
    
</body>
</html>
