<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon-Cards</title>
    <style>
        .card
        {
            background: white;
            height: 400px;
           
            padding: 5px;
            margin: 5px;
        }
        section
        {
            display: grid;
            grid-template-columns: 3fr 3fr 3fr 3fr;
            grid-gap:10px;
            margin-top: -250px;

        }
        .row
        {
            display: grid;
            grid-template-columns: 6fr 6fr;
            padding: 5px;
            margin-right: 5px;
        }

      
    </style>
</head>
<body>
    <header>
        <img src="/public/images/amazon-banner.jpg" width="100%">
    </header>
    <section>
    <div class="card">
        <div class="card-header">
            <div class="card-title"> Revamp your home in style</div>
        </div>
        <div class="card-body">
            <div class="row">
                <div>
                    <img src="/public/images/a1.jpg">

                </div>
                <div>
                    <img src="/public/images/a2.jpg">

                </div>

            </div>
            <div class="row">
                <div>
                    <img src="/public/images/a3.jpg">

                </div>
                <div>
                    <img src="/public/images/a4.jpg">

                </div>

            </div>

        </div>
        <div class="card-footer"> 

        </div>

    </div>
    <div class="card">

    </div>
    <div class="card">

    </div>
    <div class="card">

    </div>
    </section>
    
</body>
</html>
